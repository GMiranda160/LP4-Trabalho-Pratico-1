<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Funcionário - Xhopii</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <header></header>
    
    
    <main class="conteudo">
        <section class="card card--largo" aria-labelledby="titulo-func">
            <h1 class="card_titulo" id="titulo-func">Cadastrar Funcionário</h1>

            <form id="form-funcionario" novalidate>
                <div class="campo">
                    <label for="nome-func">Nome</label>
                    <input type="text" id="nome-func" name="nome" placeholder="Nome" required>
                </div>
                <div class="campo">
                    <label for="sobrenome-func">Sobrenome</label>
                    <input type="text" id="sobrenome-func" name="sobrenome" placeholder="Sobrenome" required>
                </div>
                

                <div class="campo">
                    <label for="cpf-func">CPF</label>
                    <input type="text" id="cpf-func" name="cpf" placeholder="CPF" maxlength="15" required>
                </div>
                
                <div class="campo">
                    <label for="nascimento-func">Data de Nascimento</label>
                    <input type="date" id="nascimento-func" name="nascimento" required>
                </div>

                <div class="campo">
                    <label for="telefone-func">Telefone</label>
                    <input type="tel" id="telefone-func" name="telefone" placeholder="Telefone" maxlength="15" required>
                </div>

                <div class="campo">
                    <label for="cargo">Cargo/Função</label>
                    <input type="text" id="cargo" name="cargo" placeholder="Cargo/Função" required>
                </div>

                <div class="campo">
                    <label for="salario">Salário</label>
                    <input type="number" id="salario" name="salario" placeholder="Salário" step="0,01" min="0" required>
                </div>

                <div class="campo">
                    <label for="email-func">Email</label>
                    <input type="email" id="email-func" name="email" placeholder="Email" required>
                </div>

                <div class="campo">
                    <label for="senha-func">Senha</label>
                    <input type="password" id="senha-func" name="senha" placeholder="Senha" required>
                </div>

               
                <div class="campo campo-foto">
                    <label class="foto-titulo">Selecionar foto de perfil</label>
                    <div class="foto-opcoes">
                        <label for="foto-func" class="btn-escolher-arquivo">Escolher arquivo</label>
                        <input type="file" id="foto-func" name="foto" accept="image/*" class="input-arquivo">
                        <span class="arquivo-nome">Nenhum arquivo escolhido</span>
                    </div>
                </div>

                <button type="submit" class="btn">Cadastrar</button>
            </form>
        </section>
    </main>

    <footer></footer>
    <script src="../assets/script.js"></script>
    <script>renderHeader(false);</script>
    <script>renderFooter(false)</script>
</body>
</html>
