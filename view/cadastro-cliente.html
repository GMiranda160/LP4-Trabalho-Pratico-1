<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Cliente - Xhopii</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <header></header>   

    <main class="conteudo">
        <section class="card card--largo" aria-labelledby="titulo-cliente">
            <h1 class="card__titulo" id="titulo-cliente">Cadastrar Cliente</h1>

            <form id="form-cliente" novalidate>
                <div class="campo">
                    <label for="nome-cliente">Nome</label>
                    <input type="text" id="nome-cliente" name="nome" placeholder="Nome" required>
                </div>

                <div class="campo">
                    <label for="sobrenome-cliente">Sobrenome</label>
                    <input type="text" id="sobrenome-cliente" name="sobrenome" placeholder="Sobrenome" required>
                </div>

                <div class="campo">
                    <label for="cpf-cliente">CPF</label>
                    <input type="text" id="cpf-cliente" name="cpf" placeholder="CPF" maxlength="14" required>
                </div>

                <div class="campo">
                    <label for="nascimento-cliente">Data de Nascimento</label>
                    <input type="date" id="nascimento-cliente" name="nascimento" required>
                </div>

                <div class="campo">
                    <label for="telefone-cliente">Telefone</label>
                    <input type="tel" id="telefone-cliente" name="telefone" placeholder="Telefone" maxlength="15" required>
                </div>

                <div class="campo">
                    <label for="email-cliente">Email</label>
                    <input type="email" id="email-cliente" name="email" placeholder="Email" required>
                </div>

                <div class="campo">
                    <label for="senha-cliente">Senha</label>
                    <input type="password" id="senha-cliente" name="senha" placeholder="Senha" required>
                </div>

                <div class="campo campo-foto">
                    <label class="foto-titulo">Selecionar foto de perfil</label>
                    <div class="foto-opcoes">
                        <label for="foto-cliente" class="btn-escolher-arquivo">Escolher arquivo</label>
                        <input type="file" id="foto-cliente" name="foto" accept="image/*" class="input-arquivo">
                        <span class="arquivo-nome">Nenhum arquivo escolhido</span>
                    </div>
                </div>

                <button type="submit" class="btn">Cadastrar</button>
            </form>
        </section>
    </main>

    <footer></footer>
    <script src="../assets/script.js"></script>
    <script>renderHeader(false)</script>
    <script>renderFooter(false)</script>
</body>
</html>
