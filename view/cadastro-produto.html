<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto - Xhopii</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <header></header>

    <main class="conteudo">
        <section class="card card--largo" aria-labelledby="titulo-produto">
            <h1 class="card__titulo" id="titulo-produto">Cadastrar Produto</h1>

            <form id="form-produto" novalidate>
                <div class="campo">
                    <label for="nome-produto">Nome do Produto</label>
                    <input type="text" id="nome-produto" name="nome" placeholder="Nome do Produto" required>
                </div>

                <div class="campo">
                    <label for="fabricante-produto">Fabricante</label>
                    <input type="text" id="fabricante-produto" name="fabricante" placeholder="Fabricante" required>
                </div>

                <div class="campo">
                    <label for="preco-produto">Preço</label>
                    <input type="number" id="preco-produto" name="preco" placeholder="Preço" step="0,01" min="0" required>
                </div>

                <div class="campo">
                    <label for="estoque-produto">Estoque</label>
                    <input type="number" id="estoque-produto" name="estoque" placeholder="Estoque" min="0" required>
                </div>

                <div class="campo">
                    <label for="categoria-produto">Categoria</label>
                    <input type="text" id="categoria-produto" name="categoria" placeholder="Categoria" required>
                </div>

                <div class="campo">
                    <label for="descricao-produto">Descrição</label>
                    <textarea id="descricao-produto" name="descricao" rows="3" placeholder="Descrição do produto" required></textarea>
                </div>

                <div class="campo campo-foto">
                    <label class="foto-titulo">Selecionar foto de perfil</label>
                    <div class="foto-opcoes">
                        <label for="foto-produto" class="btn-escolher-arquivo">Escolher arquivo</label>
                        <input type="file" id="foto-produto" name="foto" accept="image/*" class="input-arquivo">
                        <span class="arquivo-nome">Nenhum arquivo escolhido</span>
                    </div>
                </div>

                <button type="submit" class="btn">Cadastrar</button>
            </form>
        </section>
    </main>

    <footer></footer>
    <script src="../assets/script.js"></script>
    <script>renderHeader(false);</script>
    <script>renderFooter(false);</script>
</body>
</html>
